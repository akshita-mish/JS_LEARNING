<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in Html</title>
</head>
<style>
    table,th,td{
        border:1px solid black;
        border-collapse: collapse;
       border-style:dashed;

    }
 
</style>
<body>
    
    <table style="width: 80%;">
        <caption>Student of class 12th</caption>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>John</td>
            <td>17</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Jane</td>
            <td>18</td>
            <td>B</td>
        </tr>
        <tr>
            <td>Bob</td>
            <td>17</td>
            <td>A</td>
        </tr>
    </table>
  
</body>
</html>
